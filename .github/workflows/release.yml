name: Release

# Builds the binaries a user actually downloads, on a version tag.
#
# Self-contained on purpose: the audience writes .ks and .ahk scripts and mostly has no .NET SDK, so
# needing one to install a package manager would exclude most of them. Not trimmed, because the
# manifests are deserialized reflectively and trimming would remove the very types that reads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. v0.1.0 (a dry run; publishes nothing)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      # The platforms Keysharp itself ships for, and the same identifiers the registry uses for its
      # own artifacts, so there is one vocabulary rather than two.
      matrix:
        include:
          - rid: win-x64
          - rid: win-arm64
          - rid: linux-x64
          - rid: linux-arm64
          - rid: osx-x64
          - rid: osx-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Two builds, because there are two audiences. Someone downloading kpm on its own may have no
      # .NET at all, so that build carries its own runtime (~73 MB). Keysharp ships
      # framework-dependent and so already requires a runtime on the machine, and bundling a second
      # copy would more than triple a 21 MB install — that build is 465 KB.
      - name: Publish
        run: |
          publish() {
            # Debug symbols and the XML doc file are build outputs, not things a user downloads.
            dotnet publish src/KPM.Cli/KPM.Cli.csproj \
              -c Release -r "${{ matrix.rid }}" --self-contained "$1" \
              -p:DebugType=none -p:GenerateDocumentationFile=false \
              -p:Version="${GITHUB_REF_NAME#v}" ${3:-} -o "$2"
            rm -f "$2"/*.pdb "$2"/*.xml
          }
          publish true  "publish/standalone" "-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true"
          publish false "publish/framework-dependent"

      - name: Archive
        run: |
          mkdir -p dist
          cp README.md LICENSE publish/standalone/ 2>/dev/null || true
          cp README.md LICENSE publish/framework-dependent/ 2>/dev/null || true

          # The standalone build follows each platform's convention, since a person extracts it.
          case "${{ matrix.rid }}" in
          win-*) (cd publish/standalone && zip -qr "$OLDPWD/dist/kpm-${GITHUB_REF_NAME}-${{ matrix.rid }}.zip" .) ;;
          *)     tar -czf "dist/kpm-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" -C publish/standalone . ;;
          esac

          # The framework-dependent build is always a zip, on every platform, because what unpacks it
          # is MSBuild's Unzip task in a host's packaging - and that task reads zip and nothing else.
          # It is consumed by a build, not by a person, so the platform convention is not the one
          # that matters.
          (cd publish/framework-dependent \
            && zip -qr "$OLDPWD/dist/kpm-${GITHUB_REF_NAME}-${{ matrix.rid }}-framework-dependent.zip" .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kpm-${{ matrix.rid }}
          path: dist/*

  release:
    name: Publish the release
    needs: build
    # Only a real tag publishes; the dispatch form exists to prove the build works first.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kpm-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Download the archive for your platform, extract it, and put `kpm` on your PATH:

          ```
          kpm add Keysharp/FindText
          ```

          `kpm-<version>-<platform>` is self-contained and needs no .NET installation — that is the
          one to take unless you know otherwise.

          `…-framework-dependent.zip` is the same tool at 465 KB, relying on a .NET runtime already on
          the machine. It exists for shipping alongside something that provides one, such as
          Keysharp; installing a second copy of the runtime there would dwarf the host.

          Verify a download against `SHA256SUMS`. Packages install from
          [keysharp-org/Packages](https://github.com/keysharp-org/Packages).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "kpm $GITHUB_REF_NAME" \
            --notes-file notes.md
